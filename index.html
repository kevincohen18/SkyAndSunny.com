<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky & Sunny | Green Cheek Conures on TikTok</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'sunny-yellow': '#F5C518',
            'sunny-green': '#7EC883',
            'sky-blue': '#87CEEB',
            'sky-violet': '#7B68EE',
            'sky-deep': '#4169E1',
            'cream': '#FFF9F0',
            'charcoal': '#2D2D2D',
          },
          fontFamily: {
            heading: ['Quicksand', 'sans-serif'],
            body: ['Nunito', 'sans-serif'],
          },
        },
      },
    }
  </script>
</head>
<body class="bg-cream text-charcoal font-body">

  <!-- Navigation -->
  <nav id="navbar" class="fixed top-0 left-0 right-0 bg-white/90 backdrop-blur-md z-50 transition-shadow duration-300">
    <div class="max-w-6xl mx-auto flex justify-between items-center px-4 py-3 md:px-6">
      <!-- Brand -->
      <a href="#home" class="font-heading font-bold text-xl md:text-2xl bg-gradient-to-r from-sunny-yellow to-sky-violet bg-clip-text text-transparent">
        Sky &amp; Sunny
      </a>

      <!-- Desktop Links -->
      <div class="hidden md:flex items-center gap-6 font-heading font-600">
        <a href="#home" class="hover:text-sunny-yellow transition-colors">Home</a>
        <a href="#sunny" class="hover:text-sunny-yellow transition-colors">Sunny</a>
        <a href="#sky" class="hover:text-sky-violet transition-colors">Sky</a>
        <a href="#videos" class="hover:text-sunny-yellow transition-colors">Videos</a>
        <a href="https://www.tiktok.com/@skyandsunny.com" target="_blank" rel="noopener noreferrer" class="px-4 py-2 rounded-full bg-gradient-to-r from-sunny-yellow to-sky-violet text-white font-bold text-sm hover:scale-105 transition-transform">
          TikTok
        </a>
      </div>

      <!-- Mobile Hamburger -->
      <button id="menu-toggle" class="md:hidden flex flex-col justify-center items-center w-10 h-10 gap-1.5" aria-label="Toggle navigation menu" aria-expanded="false">
        <span class="block w-6 h-0.5 bg-charcoal transition-all duration-300" id="bar1"></span>
        <span class="block w-6 h-0.5 bg-charcoal transition-all duration-300" id="bar2"></span>
        <span class="block w-6 h-0.5 bg-charcoal transition-all duration-300" id="bar3"></span>
      </button>
    </div>

    <!-- Mobile Menu -->
    <div id="mobile-menu" class="md:hidden hidden bg-white/95 backdrop-blur-md border-t border-gray-100">
      <div class="flex flex-col items-center gap-4 py-6 font-heading font-semibold">
        <a href="#home" class="mobile-link hover:text-sunny-yellow transition-colors">Home</a>
        <a href="#sunny" class="mobile-link hover:text-sunny-yellow transition-colors">Sunny</a>
        <a href="#sky" class="mobile-link hover:text-sky-violet transition-colors">Sky</a>
        <a href="#videos" class="mobile-link hover:text-sunny-yellow transition-colors">Videos</a>
        <a href="https://www.tiktok.com/@skyandsunny.com" target="_blank" rel="noopener noreferrer" class="px-6 py-2 rounded-full bg-gradient-to-r from-sunny-yellow to-sky-violet text-white font-bold text-sm hover:scale-105 transition-transform">
          TikTok
        </a>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section id="home" class="min-h-screen flex items-center justify-center text-center pt-24 pb-16 px-4 bg-gradient-to-br from-sunny-yellow/5 via-cream to-sky-violet/5">
    <div class="max-w-4xl mx-auto">
      <h1 class="text-5xl md:text-7xl font-heading font-bold bg-gradient-to-r from-sunny-yellow to-sky-violet bg-clip-text text-transparent leading-tight mb-4">
        Sky &amp; Sunny
      </h1>
      <p class="text-lg md:text-xl text-charcoal/70 mb-10 max-w-2xl mx-auto">
        Two Green Cheek Conures Taking Over TikTok
      </p>

      <!-- Stats -->
      <div id="stats-container" class="flex flex-wrap justify-center gap-8 md:gap-12 mb-10">
        <div class="text-center">
          <span class="block text-3xl md:text-4xl font-heading font-bold text-sunny-yellow counter" data-target="11900" data-suffix="K" data-display="11.9K">0</span>
          <span class="text-sm md:text-base text-charcoal/60 font-semibold">Followers</span>
        </div>
        <div class="text-center">
          <span class="block text-3xl md:text-4xl font-heading font-bold text-sky-violet counter" data-target="882900" data-suffix="K" data-display="882.9K">0</span>
          <span class="text-sm md:text-base text-charcoal/60 font-semibold">Likes</span>
        </div>
        <div class="text-center">
          <span class="block text-3xl md:text-4xl font-heading font-bold text-sky-deep counter" data-target="13000000" data-suffix="M+" data-display="13M+">0</span>
          <span class="text-sm md:text-base text-charcoal/60 font-semibold">Views</span>
        </div>
      </div>

      <!-- CTA Button -->
      <a href="https://www.tiktok.com/@skyandsunny.com" target="_blank" rel="noopener noreferrer" class="inline-block rounded-full px-8 py-3 bg-gradient-to-r from-sunny-yellow to-sunny-green text-white font-bold shadow-lg hover:scale-105 hover:shadow-xl transition-all duration-300 text-lg">
        Watch on TikTok &rarr;
      </a>
    </div>
  </section>

  <!-- Mobile Menu Toggle Script -->
  <script>
    const menuToggle = document.getElementById('menu-toggle');
    const mobileMenu = document.getElementById('mobile-menu');
    const bar1 = document.getElementById('bar1');
    const bar2 = document.getElementById('bar2');
    const bar3 = document.getElementById('bar3');

    menuToggle.addEventListener('click', () => {
      const isOpen = !mobileMenu.classList.contains('hidden');
      mobileMenu.classList.toggle('hidden');
      menuToggle.setAttribute('aria-expanded', !isOpen);

      // Animate hamburger to X
      if (!isOpen) {
        bar1.style.transform = 'rotate(45deg) translate(4px, 4px)';
        bar2.style.opacity = '0';
        bar3.style.transform = 'rotate(-45deg) translate(4px, -4px)';
      } else {
        bar1.style.transform = '';
        bar2.style.opacity = '1';
        bar3.style.transform = '';
      }
    });

    // Close mobile menu when clicking a link
    document.querySelectorAll('.mobile-link').forEach(link => {
      link.addEventListener('click', () => {
        mobileMenu.classList.add('hidden');
        menuToggle.setAttribute('aria-expanded', 'false');
        bar1.style.transform = '';
        bar2.style.opacity = '1';
        bar3.style.transform = '';
      });
    });
  </script>

  <!-- Counter Animation Script -->
  <script>
    function animateCounters() {
      const counters = document.querySelectorAll('.counter');
      counters.forEach(counter => {
        const display = counter.getAttribute('data-display');
        const target = parseInt(counter.getAttribute('data-target'));
        const duration = 2000;
        const startTime = performance.now();

        function formatNumber(num) {
          if (target >= 1000000) {
            const millions = num / 1000000;
            if (millions >= target / 1000000) return display;
            return Math.floor(millions) + 'M+';
          } else if (target >= 1000) {
            const thousands = num / 1000;
            if (thousands >= target / 1000) return display;
            return (Math.floor(thousands * 10) / 10).toFixed(1) + 'K';
          }
          return Math.floor(num).toString();
        }

        function update(currentTime) {
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / duration, 1);
          // Ease out cubic
          const eased = 1 - Math.pow(1 - progress, 3);
          const current = eased * target;

          if (progress < 1) {
            counter.textContent = formatNumber(current);
            requestAnimationFrame(update);
          } else {
            counter.textContent = display;
          }
        }

        requestAnimationFrame(update);
      });
    }

    // Intersection Observer for stats
    const statsObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          animateCounters();
          statsObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.3 });

    const statsContainer = document.getElementById('stats-container');
    if (statsContainer) {
      statsObserver.observe(statsContainer);
    }
  </script>

</body>
</html>
